name: enso-atlas

services:
  enso-atlas:
    image: enso-atlas:2.1.0-amd64
    platform: linux/amd64
    pull_policy: never
    container_name: enso-atlas
    restart: unless-stopped
    ports:
      - "${ENSO_BIND_IP:-127.0.0.1}:${ENSO_HTTP_PORT:-8080}:8080"
    volumes:
      - enso_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    healthcheck:
      test: ["CMD", "/usr/bin/python3.13", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4).read()"]
      interval: 60s
      timeout: 8s
      retries: 3
      start_period: 30s
    environment:
      TZ: UTC

volumes:
  enso_data:
    name: enso_atlas_data
